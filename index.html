
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfie's Quest</title>
<style>
body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:
    radial-gradient(circle at top left,#ffe8c7 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ffd7d7 0%,transparent 35%),
    linear-gradient(135deg,#fff8ef,#fdf4ee);
    color:#333;
    display:flex;
    justify-content:center;
    min-height:100vh;
}

#app{

    width:100%;

    max-width:650px;

    margin:auto;

}

.card{

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:35px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.12);

    animation:fade .5s;

}

img{

    width:100%;

    height:auto;

    max-height:none;

    border-radius:22px;

    margin-bottom:20px;

}

button{

    background:#ff7b54;

    color:white;

    padding:16px 28px;

    margin:10px;

    border:none;

    border-radius:18px;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}

#popupBox button{

    background:linear-gradient(135deg,#ff8c66,#ff6333);

    min-width:150px;

    margin-top:10px;

    box-shadow:0 10px 25px rgba(255,99,51,.35);

    transition:.25s;

}

button:hover{

    background:#ff6333;

    transform:translateY(-3px);

}

#popupBox button:hover{

    transform:translateY(-3px) scale(1.04);

    box-shadow:0 15px 35px rgba(255,99,51,.45);

}

button:active{

    transform:scale(.97);

}

h1{

    color:#ff6333;

}

h2{

    color:#444;

}

h3{

    color:#444;

}

@keyframes fade{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}

@keyframes popup{

    0%{

        transform:scale(.75);

        opacity:0;

    }

    70%{

        transform:scale(1.05);

    }

    100%{

        transform:scale(1);

        opacity:1;

    }

}

@keyframes iconBounce{

    0%{

        transform:scale(.4) rotate(-15deg);

        opacity:0;

    }

    60%{

        transform:scale(1.2) rotate(10deg);

    }

    100%{

        transform:scale(1) rotate(0deg);

        opacity:1;

    }

}
    
#popupOverlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    background:rgba(0,0,0,.45);

    backdrop-filter:blur(6px);

    z-index:9999;

    animation:fade .25s;

}

#popupBox{

    background:white;

    width:90%;

    max-width:420px;

    padding:35px;

    border-radius:26px;

    text-align:center;

    box-shadow:0 25px 60px rgba(0,0,0,.25);

    animation:popup .28s ease;

}

#popupIcon{

    font-size:52px;

    animation:iconBounce .45s ease;

}

#popupIconWrapper{

    width:90px;

    height:90px;

    margin:0 auto 18px;

    border-radius:50%;

    background:linear-gradient(135deg,#fff3ea,#ffe2d5);

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:0 8px 20px rgba(255,99,51,.15);

}

#popupTitle{

    margin:10px 0;

    color:#ff6333;

    font-size:32px;

    font-weight:700;

}

#popupText{

    font-size:20px;

    line-height:1.6;

    color:#555;

    margin-bottom:28px;

}
    
</style>
</head>

<body>

<div id="fx"></div>

<div id="app"></div>

<div id="popupOverlay" style="display:none;">
    <div id="popupBox">
        <div id="popupIconWrapper">
    <div id="popupIcon">🐶</div>
</div>
        <h2 id="popupTitle"></h2>
        <p id="popupText"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>

<script>
const steps=[
{title:"🐶 Alfie's Quest",img:"poza 00.jpeg",html:`<h2>🐶 Alfie's Quest</h2><p>Alfie needs your help!</p><button onclick="next()">Start the Quest 🚀</button>`},
{q:`<h3>1. Who is the most handsome Corgi in the world?</h3>
<button onclick="a1('A')">A. Alfie the Unicorn</button><button onclick="a1('B')">B. Susan, Willow and Holly</button><button onclick="a1('C')">C. Maxine the fluffy corgi</button>`},
{img:"poza 0.jpeg",msg:"🐾 Great job! You know me very well!"},
{q:`<h3>2. Which sounds make me go crazy instantly? 🐶</h3><label><input id=a type=checkbox> The sound of Mom's Dyson 💨</label><br><label><input id=b type=checkbox> Dad making coffee ☕</label><br><label><input id=c type=checkbox> My personal fur collector 🤖</label><br><button onclick="a2()">Confirm ✅</button>`},
{img:"poza 1.jpeg",msg:"🔊 Correct!"},
{q:`<h3>3. Who do I listen to the most?</h3><button onclick="a3('A')">Mom</button><button onclick="a3('B')">Dad</button><button onclick="a3('C')">The neighbor's dog</button>`},
{img:"poza 2.jpeg",msg:"😎 Exactly!"},
{q:`<h3>4. Who loves me the most outside my family?</h3><button onclick="a4('A')">Charles and Alexandra Leclerc</button><button onclick="a4('B')">King Charles III and Queen Camilla</button><button onclick="a4('C')">❤️Dani and Amalia❤️</button>`},
{img:"poza 3.jpeg",msg:"❤️ Absolutely right!"},
{
q:`

<h2>🐶 Alfie has one last quest for you...</h2>

<p style="font-size:22px;margin-bottom:25px;">
This challenge might change your lives forever ❤️
</p>

<div style="position:relative;height:130px;">

<button
onclick="next()"
style="
position:absolute;
left:50%;
transform:translateX(-50%);
">

I'm ready! 🚀

</button>

<button

id="runButton"

style="
position:absolute;
top:70px;
left:45%;
transition:.25s;
background:#888;
"

onmouseover="runAway()"

>

Maybe not... 😅

</button>

</div>

`
},

{
q:`

<h1 style="font-size:40px;margin-bottom:10px;">
❤️
</h1>

<h2 style="font-size:38px;">
Will you be our Godparents?
</h2>

<p style="font-size:22px;">
(There is only one correct answer 😄)
</p>

<br>

<button onclick="finish()">

YES ❤️

</button>

<button onclick="finish()">

ABSOLUTELY ❤️

</button>

<button onclick="finish()">

OF COURSE ❤️

</button>

`
}

];

let i=0;

function showPopup(icon,title,text){

    document.getElementById("popupIcon").textContent=icon;

    document.getElementById("popupTitle").textContent=title;

    document.getElementById("popupText").textContent=text;

    document.getElementById("popupOverlay").style.display="flex";

}

let popupNext=null;

function closePopup(){

    document.getElementById("popupOverlay").style.display="none";

    if(popupNext){

        popupNext();

        popupNext=null;

    }

}
    
function runAway(){

const b=document.getElementById("runButton");

if(!b)return;

const x=Math.random()*220-110;

const y=Math.random()*70-35;

b.style.transform=
`translate(${x}px,${y}px)`;

}
function render(){
let s=steps[i],h='<div class="card">';
if(s.img)h+=`<img src="${s.img}"><br>`;
if(s.html)h+=s.html;
if(s.q)h+=s.q;
if(s.msg)h+=`<h2>${s.msg}</h2><button onclick="next()">Next Challenge ➜</button>`;
h+='</div>';
app.innerHTML=h;
}
function next(){i++;render();}
function a1(v){

    if(v==='A'){

        next();

    }else{

        showPopup(
            "🐶",
            "Oops!",
            "Not quite... try again!"
        );

    }

}
function a2(){

    if(a.checked&&b.checked&&c.checked){

        next();

    }else{

        showPopup(
            "😉",
            "Almost!",
            "Maybe more than one answer is correct."
        );

    }

}
function a3(v){

    if(v==='B'){

        showPopup(
    "😎",
    "Fun fact!",
    "To be honest... I have a strong personality. Sometimes I don't listen to anyone."
);

popupNext=next;

    }else{

        showPopup(
            "🐶",
            "Oops!",
            "Not this time... Try again!"
        );

    }

}
function a4(v){

    if(v==='C'){

        showPopup(
    "❤️",
    "Exactly!",
    "They love me the most, and I'm happiest when they come to visit and let me cover them with kisses!"
);

popupNext=next;

    }else{

        showPopup(
            "🐶",
            "Almost!",
            "Give it another try!"
        );

    }

}
function finish(){

app.innerHTML=`
<div class="card">

<img src="poza finala.jpeg">

<h1
style="
font-size:48px;
color:#ff6333;
margin-bottom:10px;
">

❤️ Welcome to the Family ❤️

</h1>

<h2
style="
font-size:28px;
color:#666;
margin-top:0;
margin-bottom:35px;
">

🐶 Godmother & Godfather Unlocked! ✨

</h2>

<h2
style="
font-size:34px;
">

Thank you for saying...

</h2>

<h1
style="
font-size:58px;
color:#ff6333;
">

YES ❤️

</h1>

<p
style="
font-size:22px;
margin-top:20px;
">

We can't wait to share this journey with you ❤️.

</p>

<canvas id="fireworks"></canvas>

</div>
`;

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.style.position="fixed";
canvas.style.left="0";
canvas.style.top="0";
canvas.style.width="100vw";
canvas.style.height="100vh";
canvas.style.pointerEvents="none";

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function explosion(){

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height*0.45;

    for(let i=0;i<80;i++){

        particles.push({

            x,

            y,

            dx:(Math.random()-0.5)*8,

            dy:(Math.random()-0.5)*8,

            life:100,

            color:`hsl(${Math.random()*360},100%,60%)`

        });

    }

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{

        p.x+=p.dx;
        p.y+=p.dy;

        p.dy+=0.03;

        p.life--;

        ctx.beginPath();

        ctx.fillStyle=p.color;

        ctx.arc(p.x,p.y,3,0,Math.PI*2);

        ctx.fill();

        if(p.life<=0){

            particles.splice(index,1);

        }

    });

    requestAnimationFrame(animate);

}

animate();

explosion();

setInterval(explosion,900);

}
render();
</script></body></html>
