
<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfie's Quest</title>
<style>
body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;
    background:
    radial-gradient(circle at top left,#ffe8c7 0%,transparent 35%),
    radial-gradient(circle at bottom right,#ffd7d7 0%,transparent 35%),
    linear-gradient(135deg,#fff8ef,#fdf4ee);
    color:#333;
    display:flex;
    justify-content:center;
    min-height:100vh;
}

#app{

    width:100%;

    max-width:650px;

    margin:auto;

}

.card{

    background:rgba(255,255,255,.92);

    backdrop-filter:blur(10px);

    border-radius:30px;

    padding:35px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.12);

    animation:fade .5s;

}

img{

    width:100%;

    height:auto;

    max-height:none;

    border-radius:22px;

    margin-bottom:20px;

}

button{

    background:#ff7b54;

    color:white;

    padding:16px 28px;

    margin:10px;

    border:none;

    border-radius:18px;

    font-size:18px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;

}

button:hover{

    background:#ff6333;

    transform:translateY(-3px);

}

button:active{

    transform:scale(.97);

}

h1{

    color:#ff6333;

}

h2{

    color:#444;

}

h3{

    color:#444;

}

@keyframes fade{

    from{

        opacity:0;
        transform:translateY(20px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}
</style></head><body><div id="fx"></div><div id="app"></div>
<script>
const steps=[
{title:"🐶 Alfie's Quest",img:"poza 00.jpeg",html:`<h2>🐶 Alfie's Quest</h2><p>Alfie are nevoie de ajutorul vostru!</p><button onclick="next()">Start</button>`},
{q:`<h3>1. Cine este cel mai frumos Corgi din lume?</h3>
<button onclick="a1('A')">A. Alfie the Unicorn</button><button onclick="a1('B')">B. Susan, Willow and Holly</button><button onclick="a1('C')">C. Maxine the fluffy corgi</button>`},
{img:"poza 0.jpeg",msg:"🐾 Good Job! You know me well!"},
{q:`<h3>2. Ce sunet mă activează instant?</h3><label><input id=a type=checkbox> Dysonul lui mami</label><br><label><input id=b type=checkbox> Aparatul de cafea a lui tati</label><br><label><input id=c type=checkbox> Robotul strângător de blană</label><br><button onclick="a2()">Confirmă</button>`},
{img:"poza 1.jpeg",msg:"🔊 Good Job!"},
{q:`<h3>3. De cine ascult mai mult?</h3><button onclick="a3('A')">Mami</button><button onclick="a3('B')">Tati</button><button onclick="a3('C')">Prietenul de după gard</button>`},
{img:"poza 2.jpeg",msg:"😎 Good Job!"},
{q:`<h3>4. Cine mă iubește cel mai mult din afara familiei?</h3><button onclick="a4('A')">Manu și Alin</button><button onclick="a4('B')">Bogdan și Sabina</button><button onclick="a4('C')">Dani și Amalia</button>`},
{img:"poza 3.jpeg",msg:"❤️ Good Job!"},
{
q:`

<h2>🐶 Alfie has one last quest for you...</h2>

<p style="font-size:22px;margin-bottom:25px;">
This challenge might change your lives forever ❤️
</p>

<div style="position:relative;height:130px;">

<button
onclick="next()"
style="
position:absolute;
left:50%;
transform:translateX(-50%);
">

I'm ready! 🚀

</button>

<button

id="runButton"

style="
position:absolute;
top:70px;
left:45%;
transition:.25s;
background:#888;
"

onmouseover="runAway()"

>

Maybe not... 😅

</button>

</div>

`
},

{
q:`

<h1 style="font-size:40px;margin-bottom:10px;">
❤️
</h1>

<h2 style="font-size:38px;">
Will you be our Godparents?
</h2>

<p style="font-size:22px;">
(There is only one correct answer 😄)
</p>

<br>

<button onclick="finish()">

YES ❤️

</button>

<button onclick="finish()">

ABSOLUTELY ❤️

</button>

<button onclick="finish()">

OF COURSE ❤️

</button>

`
}
let i=0;
function runAway(){

const b=document.getElementById("runButton");

if(!b)return;

const x=Math.random()*220-110;

const y=Math.random()*70-35;

b.style.transform=
`translate(${x}px,${y}px)`;

}
function render(){
let s=steps[i],h='<div class="card">';
if(s.img)h+=`<img src="${s.img}"><br>`;
if(s.html)h+=s.html;
if(s.q)h+=s.q;
if(s.msg)h+=`<h2>${s.msg}</h2><button onclick="next()">Continue ➜</button>`;
h+='</div>';
app.innerHTML=h;
}
function next(){i++;render();}
function a1(v){if(v==='A')next();else alert('Mai gândește-te!');}
function a2(){if(a.checked&&b.checked&&c.checked)next();else alert('Mai gândește-te... poate sunt mai multe.');}
function a3(v){if(v==='B'){alert('Am o personalitate puternică, uneori nu ascult de nimeni.');next();}else alert('Încearcă din nou');}
function a4(v){if(v==='C'){alert('Bineînțeles că ei 2 mă iubesc cel mai mult și sunt cel mai fericit când vin la mine și mă lasă să îi ling. 👅🐶');next();}else alert('Mai încearcă');}
function finish(){

app.innerHTML=`
<div class="card">

<img src="poza finala.jpeg">

<h1
style="
font-size:48px;
color:#ff6333;
">

❤️ We are now family ❤️

</h1>

<h2
style="
font-size:34px;
">

Thank you for saying...

</h2>

<h1
style="
font-size:58px;
color:#ff6333;
">

YES ❤️

</h1>

<p
style="
font-size:22px;
margin-top:20px;
">

We can't wait to share this journey with you.

</p>

<canvas id="fireworks"></canvas>

</div>
`;

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");

canvas.style.position="fixed";
canvas.style.left="0";
canvas.style.top="0";
canvas.style.width="100vw";
canvas.style.height="100vh";
canvas.style.pointerEvents="none";

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

function explosion(){

    const x=Math.random()*canvas.width;
    const y=Math.random()*canvas.height*0.45;

    for(let i=0;i<80;i++){

        particles.push({

            x,

            y,

            dx:(Math.random()-0.5)*8,

            dy:(Math.random()-0.5)*8,

            life:100,

            color:`hsl(${Math.random()*360},100%,60%)`

        });

    }

}

function animate(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    particles.forEach((p,index)=>{

        p.x+=p.dx;
        p.y+=p.dy;

        p.dy+=0.03;

        p.life--;

        ctx.beginPath();

        ctx.fillStyle=p.color;

        ctx.arc(p.x,p.y,3,0,Math.PI*2);

        ctx.fill();

        if(p.life<=0){

            particles.splice(index,1);

        }

    });

    requestAnimationFrame(animate);

}

animate();

explosion();

setInterval(explosion,900);

}
render();
</script></body></html>
